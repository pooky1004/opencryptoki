# Token NCMP - slot mapping configuration (sample).
#
# The application (or opencryptoki.conf, when libpkcs11_ncmp.so runs under
# pkcsslotd) numbers slots independently of the ncmpd daemon, which numbers the
# physical Cypress FX3 boards 0 .. PKCS11_MAX_SLOT_COUNT-1. This file maps the
# application-visible CK slot id onto the physical daemon slot so the two agree.
#
# Install to /etc/opencryptoki/ncmptok.conf, or point the library at another
# path with the NCMP_TOK_CONF environment variable. Without this file the
# library falls back to an identity map offset by NCMP_SLOT_BASE (default 0):
# ck_slot = NCMP_SLOT_BASE + phys_slot for every online physical slot.
#
# A CK slot is exposed by C_GetSlotList only when its physical slot is reported
# online by ncmpd, so entries for absent boards are harmless.
#
# Format (one entry per line):
#   <ck_slot>  <phys_slot>  [label ...]
#
# Example: expose the first FX3 board as CK slot 5 (matching the commented
# "slot 5" entry in opencryptoki.conf), and a second board as CK slot 6.
5  0  NCMP FX3 board 0
6  1  NCMP FX3 board 1
