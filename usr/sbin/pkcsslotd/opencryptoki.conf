version opencryptoki-3.27

# The following defaults are defined:
#       hwversion = "0.0"
#       firmwareversion = "0.0"
#       description = Linux
#       manufacturer = IBM
#       usergroup = pkcs11
#
# The slot definitions below may be overridden and/or customized.
# For example:
#       slot 0
#       {
#          stdll = libpkcs11_cca.so
#          description = "OCK CCA Token"
#          manufacturer = "MyCompany Inc."
#          hwversion = "2.32"
#          firmwareversion = "1.0"
#          tokname = mytoken
#          tokversion = 3.12
#          confname = myccatok.conf
#          usergroup = mygroup
#       }
#
# See man(5) opencryptoki.conf for further information.
#
slot 0
{
    stdll = libpkcs11_tpm.so
    tokversion = 3.12
}

slot 1
{
    stdll = libpkcs11_ica.so
    tokversion = 3.12
}

slot 2
{
    stdll = libpkcs11_cca.so
    confname = ccatok.conf
    tokversion = 3.12
}

slot 3
{
    stdll = libpkcs11_sw.so
    tokversion = 3.12
}

slot 4
{
    stdll = libpkcs11_ep11.so
    confname = ep11tok.conf
    tokversion = 3.12
}

# NCMP USB token (Cypress FX3 via the ncmpd daemon). Built only with
# --enable-ncmptok; ncmpd must be running before this slot is used. Uncomment
# to activate.
#
# This "slot 5" is the opencryptoki slot number. ncmpd numbers the physical FX3
# boards 0..3 independently; the two are reconciled by ncmptok.conf (or the
# NCMP_SLOT_BASE env var) - see usr/lib/ncmp_stdll/ncmptok.conf. Keep the
# confname's ck_slot entry (e.g. "5 0 ...") in sync with the slot number below.
#slot 5
#{
#    stdll = libpkcs11_ncmp.so
#    confname = ncmptok.conf
#    tokversion = 3.12
#}
